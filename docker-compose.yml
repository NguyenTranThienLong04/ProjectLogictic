services:
  redis:
    image: redis:7.4-alpine
    container_name: logistics-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - logistics-redis-data:/data

volumes:
  logistics-redis-data:
